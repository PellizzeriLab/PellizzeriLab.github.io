<!DOCTYPE html>
<html lang="en">

  {% include head.html %}

  <body>

    <div id="scrollProgress" class="scroll-progress" aria-hidden="true"></div>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    {% include header.html %}

    <main id="main-content" style="margin-top: 80px;">
      <div class="container-lg py-5">
        <div class="row">
          {{ content }}
        </div>
      </div>
    </main>

    {% include footer.html %}

    <button id="backToTop" class="back-to-top" type="button" aria-label="Back to top">↑</button>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ site.url }}{{ site.baseurl }}/js/site.js"></script>

  </body>

</html>
