---
layout: default
---
<div class="col-12">
  <article>
    <header class="mb-4">
      <h1 class="mb-2">{{ page.title }}</h1>
      <p class="text-muted"><small>Published on <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %-d, %Y" }}</time>{% if page.author %} by {{ page.author }}{% endif %}</small></p>
    </header>

    <div class="content">
      {{ content }}
    </div>
  </article>
</div>
